const video=document.getElementById('kioskVideo');
const tap=document.getElementById('tap');
video.src='data:video/mp4;base64,'+chunks.join('');
const play=async()=>{video.muted=true;try{await video.play();tap.classList.remove('show')}catch(_){tap.classList.add('show')}};
const resume=()=>{if(video.paused)play()};
window.addEventListener('load',play,{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resume()});
window.addEventListener('focus',resume);
tap.addEventListener('click',play);
tap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
