<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Donation Kiosk</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:#000; overflow:hidden; }
    body { position:fixed; inset:0; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  </style>
</head>
<body>
  <video id="kioskVideo" autoplay muted loop playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen">
    <source src="/gemini_generated_video_77009492.mp4" type="video/mp4" />
  </video>
  <script>
    (() => {
      const video = document.getElementById('kioskVideo');
      video.muted = true;
      video.loop = true;
      const play = () => video.play().catch(() => {});
      video.addEventListener('ended', () => { video.currentTime = 0; play(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); });
      window.addEventListener('focus', play);
      window.addEventListener('pageshow', play);
      play();
    })();
  </script>
</body>
</html>
